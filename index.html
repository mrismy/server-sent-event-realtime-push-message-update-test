<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Cookie-Based SSE Native Auto-Reconnect Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
        }

        .status {
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }

        .status.open {
            background: #15803d;
            color: #fff;
        }

        .status.refreshing {
            background: #d97706;
            color: #fff;
        }

        .status.closed {
            background: #b91c1c;
            color: #fff;
        }

        .status.idle {
            background: #1e293b;
            color: #93c5fd;
            border: 1px solid #3b82f6;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            cursor: pointer;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #2563eb;
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #334155;
            color: #cbd5e1;
            border-color: #475569;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #475569;
            color: #f8fafc;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.4);
        }

        .btn-danger:hover:not(:disabled) {
            background: rgba(239, 68, 68, 0.3);
        }

        ul {
            list-style: none;
            padding: 0;
            background: #1e293b;
            border-radius: 8px;
            max-height: 380px;
            overflow-y: auto;
            border: 1px solid #334155;
        }

        li {
            padding: 10px 16px;
            border-bottom: 1px solid #334155;
            font-family: monospace;
            font-size: 0.95rem;
        }

        li:last-child {
            border-bottom: none;
        }

        .event-id {
            color: #38bdf8;
            font-weight: bold;
            margin-right: 8px;
        }

        /* Login Modal Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            animation: modalFadeIn 0.2s ease-out;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 1.15rem;
            color: #f8fafc;
        }

        .modal-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.4rem;
            line-height: 1;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 4px;
        }

        .modal-close:hover {
            color: #f8fafc;
            background: rgba(255, 255, 255, 0.08);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #94a3b8;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border-radius: 6px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .login-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h2>Cookie-Based SSE</h2>

    <div id="status" class="status idle">
         Welcome! Please log in to start the SSE stream.
    </div>

    <div class="controls">
        <button id="btn-login" class="btn-primary">
            Log In
        </button>
        <button id="btn-revoke" class="btn-danger" disabled>
            Simulate Session Revoke (401 Test)
        </button>
    </div>

    <h3>Messages:</h3>

    <ul id="messages"></ul>

    <!-- Login Modal Popup -->
    <div id="login-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Sign In</h3>
                <button type="button" id="modal-close" class="modal-close" aria-label="Close">&times;</button>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" value="admin" autocomplete="username" required />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" value="admin" autocomplete="current-password" required />
                </div>
                <div id="login-error" class="login-error" style="display: none;"></div>
                <div class="modal-actions">
                    <button type="button" id="btn-cancel" class="btn-secondary">Cancel</button>
                    <button type="submit" id="btn-submit-login" class="btn-primary">Sign In & Start Stream</button>
                </div>
            </form>
        </div>
    </div>

    <script src="client.js"></script>

</body>

</html>
